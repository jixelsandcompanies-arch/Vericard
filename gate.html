<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriCard Portal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#061a30">
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="brand-lockup">
        <img src="/assets/vericard-logo.jpeg" alt="VeriCard">
        <h1 id="gateTitle">VeriCard Portal</h1>
      </div>
      <div class="row"><span class="status" id="gateStatus">Out of duty</span><button class="secondary hidden" id="installAppBtn">Install Scanner App</button><button class="secondary hidden" id="endDutyBtn">End Duty</button></div>
    </div>
  </header>
  <main class="wrap">
    <section class="panel hidden" id="scannerSetupPanel">
      <h2>Finish Scanner Setup</h2>
      <div class="notice" id="setupIntro">Loading scanner setup...</div>
      <form id="scannerSetupForm">
        <label>Registered phone number<input name="phone" required></label>
        <label>Your scanner password<input name="password" type="password" minlength="6" required></label>
        <button type="submit">Save Scanner Password</button>
      </form>
      <div class="notice hidden" id="setupNotice"></div>
    </section>

    <section class="panel" id="gateLoginPanel">
      <h2>Scanner Staff Login</h2>
      <form id="gateLoginForm">
        <label>Organization ID<input name="organizationId" required></label>
        <label>Registered phone number<input name="phone" required></label>
        <label>Scanner password<input name="password" type="password" required></label>
        <label>Device / place<input name="gateName" value="Reception" required></label>
        <button type="submit">Start Duty</button>
      </form>
      <div class="notice">Scanner device ID: <strong id="deviceIdLabel"></strong></div>
      <div class="notice hidden" id="loginNotice"></div>
    </section>

    <section class="panel hidden" id="scannerPanel">
      <h2>Scan and Confirm</h2>
      <form id="previewForm">
        <label>Scan action
          <select name="action">
            <option value="enter">Sign In</option>
            <option value="report">Report / update location</option>
            <option value="leave">Sign Out</option>
          </select>
        </label>
        <label>Card QR token or scanned URL<input name="token" autocomplete="off" required></label>
        <button type="submit">Preview Card</button>
      </form>
      <div class="notice hidden" id="scanNotice"></div>
      <article class="panel hidden" id="confirmPanel">
        <h2>Confirm Before Saving</h2>
        <div class="scan-confirm">
          <img id="personPhoto" class="logo-preview hidden" alt="">
          <div>
            <strong id="personName"></strong>
            <div id="personMeta"></div>
            <div id="personOrg"></div>
            <div id="personState"></div>
            <div id="feeStatus"></div>
          </div>
        </div>
        <div class="row">
          <button type="button" id="confirmBtn">Confirm Sign In</button>
          <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        </div>
      </article>
    </section>
  </main>
  <script src="/js/pwa.js"></script>
  <script src="/js/gate.js"></script>
</body>
</html>
